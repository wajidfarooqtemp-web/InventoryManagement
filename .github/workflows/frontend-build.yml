name: Frontend Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      # "Taste-tester" step - must succeed before anything below runs.
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Only reached if the build/test steps above succeeded - that's the
      # actual gate. Rather than building locally in this runner and
      # uploading it (vercel build --prebuilt), which has real unresolved
      # problems with monorepo-style projects like this one, we let
      # Vercel build on its own infrastructure instead - the same way it
      # always did. We're only changing WHEN that's triggered: from "any
      # push" to "only a push this workflow has already approved."
      #
      # IMPORTANT: this step deliberately overrides the job's default
      # working-directory (frontend) back to the repo root. The .vercel
      # link at the repo root already knows the project lives in
      # "frontend" (see .vercel/repo.json) - running this FROM frontend
      # makes the CLI append that path a second time, producing the
      # broken "frontend/frontend" path seen in earlier failed runs.
      - name: Deploy to Vercel (production)
        working-directory: .
        run: |
          npm install -g vercel
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}